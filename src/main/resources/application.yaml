spring:
  application:
    name: mvp
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000

server:
  port: 8080
  tomcat:
    threads:
      max: 100
      min-spare: 10


springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html #로컬에서 swagger 주소 : http://localhost:8080/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      display-name: 'MVP API'