version: '3.8'

services:
  blue:
    image: ${DOCKERHUB_USERNAME}/mvp-backend:latest
    container_name: mvp-backend-blue
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/hello || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 36s
    networks:
      - mvp-network

  green:
    image: ${DOCKERHUB_USERNAME}/mvp-backend:latest
    container_name: mvp-backend-green
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/hello || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mvp-network

networks:
  mvp-network:
    driver: bridge
