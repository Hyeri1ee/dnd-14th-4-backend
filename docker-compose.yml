services:
  blue:
    image: ${DOCKERHUB_USERNAME}/mvp-backend:latest
    container_name: mvp-backend-blue
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8080/api/hello || exit 1
"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - mvp-network

  green:
    image: ${DOCKERHUB_USERNAME}/mvp-backend:latest
    container_name: mvp-backend-green
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8080/api/hello || exit 1
"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - mvp-network

networks:
  mvp-network:
    driver: bridge
